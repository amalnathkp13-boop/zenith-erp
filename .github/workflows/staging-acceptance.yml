      - name: Verify Tax services, persistence, isolation and both UI shells
        if: github.event_name == 'workflow_dispatch' && inputs.contacts_profile == 'tax'
        env:
          TAX_QA_BASE: http://localhost:8080
          TAX_QA_OUT: ${{ runner.temp }}/tax-profile
        run: |
          set -euo pipefail
          export NODE_PATH="$GITHUB_WORKSPACE/node_modules"
          export PUPPETEER_EXECUTABLE_PATH=$(node -e 'process.stdout.write(require("puppeteer").executablePath())')
          python3 "$CONTACTS_QA_SOURCE_DIR/docs/qa/tax-runtime/acceptance.py"
          node "$CONTACTS_QA_SOURCE_DIR/docs/qa/tax-runtime/ui.cjs"
          DBID=$(docker compose -f "$COMPOSE" ps -q db)
          docker exec -i "$DBID" psql -U moqui -d moqui -v ON_ERROR_STOP=1 < "$CONTACTS_QA_SOURCE_DIR/docs/qa/tax-runtime/assert.sql"

      - name: Save Tax verification evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.contacts_profile == 'tax'
        uses: actions/upload-artifact@v4
        with:
          name: tax-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/tax-profile
          if-no-files-found: error
          retention-days: 14

      - name: Dump Moqui logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE" logs --tail=200 moqui || true

      - name: PR comment — failed (sticky)
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER='<!-- staging-acceptance-sticky -->'
          FAILS=$(grep -E 'FAIL|SMOKE FAILED' "$RUNNER_TEMP/smoke.txt" 2>/dev/null | sed 's/^/- /' || true)
          BODY=$(printf '%s\n### ❌ staging-acceptance failed\nThis change does not boot/render cleanly on the ephemeral staging stack.\n\n%s\n\n[View the run](%s) · report-only (not a merge gate on this plan).\n' \
            "$MARKER" "${FAILS:-See the run for details.}" "$RUN_URL")
          cid=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$cid" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" -f body="$BODY" >/dev/null && echo "updated $cid";
          else gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" >/dev/null && echo created; fi || echo "could not comment (token perms — e.g. a fork PR?)"

      - name: PR comment — passed (clear sticky)
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER='<!-- staging-acceptance-sticky -->'
          cid=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$cid" ]; then
            BODY=$(printf '%s\n### ✅ staging-acceptance passed\nRenders cleanly on /apps and /qapps.\n\n[View the run](%s)\n' "$MARKER" "$RUN_URL")
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" -f body="$BODY" >/dev/null && echo "flipped $cid to pass" || echo "could not update"
          else echo "no sticky comment to clear"; fi

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE" down -v || true

      - name: Assert Sales disposable database teardown
        # Reconciled from PR #23: after tear-down, prove no staging container/volume remains (the DB
        # lives in a tmpfs disposable container). Dispatch-only + sales-gated.
        if: always() && github.event_name == 'workflow_dispatch' && inputs.contacts_profile == 'sales'
        run: |
          set -euo pipefail
          PROJECT=$(docker compose -f "$COMPOSE" config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')
          test -z "$(docker ps -aq --filter "label=com.docker.compose.project=$PROJECT")"
          test -z "$(docker volume ls -q --filter "label=com.docker.compose.project=$PROJECT")"
          mkdir -p "$RUNNER_TEMP/sales-cleanup"
          printf '{"candidate":"%s","containersRemaining":0,"volumesRemaining":0,"databaseStorage":"removed with disposable tmpfs container"}\n' "$CANDIDATE_SHA" > "$RUNNER_TEMP/sales-cleanup/teardown.json"

      - name: Save Sales teardown proof
        if: always() && github.event_name == 'workflow_dispatch' && inputs.contacts_profile == 'sales'
        uses: actions/upload-artifact@v4
        with:
          name: sales-teardown-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/sales-cleanup
          if-no-files-found: error
          retention-days: 14

      - name: Assert Tax disposable teardown
        if: always() && github.event_name == 'workflow_dispatch' && inputs.contacts_profile == 'tax'
        run: |
          set -euo pipefail
          PROJECT=$(docker compose -f "$COMPOSE" config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')
          test -z "$(docker ps -aq --filter "label=com.docker.compose.project=$PROJECT")"
          test -z "$(docker volume ls -q --filter "label=com.docker.compose.project=$PROJECT")"
          mkdir -p "$RUNNER_TEMP/tax-cleanup"
          printf '{"candidate":"%s","containersRemaining":0,"volumesRemaining":0}\n' "$CANDIDATE_SHA" > "$RUNNER_TEMP/tax-cleanup/teardown.json"

      - name: Save Tax teardown proof
        if: always() && github.event_name == 'workflow_dispatch' && inputs.contacts_profile == 'tax'
        uses: actions/upload-artifact@v4
        with:
          name: tax-teardown-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/tax-cleanup
          if-no-files-found: error
          retention-days: 14

      - name: Assert POS disposable database teardown
        if: always() && env.POS_QA_ENABLED == 'true'
        run: |
          set -euo pipefail
          PROJECT=$(docker compose -f "$COMPOSE" config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')
          test -z "$(docker ps -aq --filter "label=com.docker.compose.project=$PROJECT")"
          test -z "$(docker volume ls -q --filter "label=com.docker.compose.project=$PROJECT")"
          mkdir -p "$RUNNER_TEMP/pos-cleanup"
          printf '{"containersRemaining":0,"volumesRemaining":0,"databaseStorage":"removed with disposable tmpfs container"}\n' > "$RUNNER_TEMP/pos-cleanup/teardown.json"

      - name: Save POS teardown proof
        if: always() && env.POS_QA_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pos-teardown-${{ inputs.candidate_sha || github.sha }}
          path: ${{ runner.temp }}/pos-cleanup
          if-no-files-found: error
          retention-days: 14
