# Phase-1 of the auto-deploy proposal (docs/infra/auto-deploy-proposal.md): REPORT-ONLY.
#
# Boots an ephemeral staging stack from a clean runtime image assembled without production
# image layers (`staging-image-clean-v1`), verifies its pinned checksum, overlays the checked-out
# component tree (as a prod deploy does), seeds demo data, and renders a smoke set on /apps + /qapps.
# NEVER touches production and has no prod credentials. Red = this change doesn't boot/render cleanly.
#
# Runs for PRs and master, with manual dispatch available for diagnosis.
name: staging-acceptance
run-name: staging ${{ github.event.inputs.contacts_profile || 'none' }} · ${{ github.event.inputs.candidate_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional same-repository commit to overlay and verify
        required: false
        type: string
      contacts_profile:
        description: Additional synthetic Contacts, Sales or Tax verification
        required: true
        default: none
        type: choice
        options: [none, ui, security, sales, tax, pos]
  pull_request:
    branches: [master]
  push:                 # on-merge runs: re-check the merged result on master (no PR comment on push)
    branches: [master]

permissions:
  contents: read
  pull-requests: write      # to post/update the sticky PR comment on failure (same-repo PRs)

concurrency:
  group: staging-${{ github.ref }}-${{ github.event.inputs.candidate_sha || github.sha }}-${{ github.event.inputs.contacts_profile || 'none' }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  IMAGE_RELEASE: staging-image-clean-v1
  IMAGE_ASSET: zetaerp-moqui-clean.tar.gz
  IMAGE_SHA256: 0305b2d2f7124781c41de04eb8aa8a7847ee5116ee01f09dc52d7f12dc513b93
  COMPOSE: docs/infra/ci/docker-compose.staging.yml
  CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha || '' }}
  CONTACTS_PROFILE: ${{ github.event.inputs.contacts_profile || 'none' }}

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Classify change risk (report-only, Phase-2 groundwork)
        # Decide whether this change is 'trivial' (docs/CI/presentation -> would auto-deploy in Phase 2)
        # or 'sensitive' (app behaviour -> a human one-click approve). REPORT-ONLY: nothing here gates
        # or deploys. The tier goes to the run's job summary; validating it on real PRs for a while is
        # the groundwork for Phase 2's risk-tiered gate. Never fails the run.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "### Change risk tier: N/A (manual dispatch — no PR/push diff)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' 2>/dev/null)
          else
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/${{ github.event.before }}...${{ github.sha }}" --jq '.files[].filename' 2>/dev/null)
          fi
          out=$(printf '%s\n' "$files" | bash docs/infra/ci/classify-risk.sh 2>/dev/null)
          tier=$(echo "$out" | sed -n 's/^TIER=//p'); tier=${tier:-sensitive}
          rationale=$(echo "$out" | sed -n 's/^RATIONALE=//p')
          icon="🟠"; [ "$tier" = "trivial" ] && icon="🟢"
          {
            echo "### $icon Change risk tier: \`$tier\`"
            echo "${rationale:-could not classify; defaulting to sensitive}"
            echo ""
            echo "Changed files:"
            printf '%s\n' "$files" | sed '/^$/d; s/^/- /'
            echo ""
            echo "_Report-only (Phase-2 groundwork): in Phase 2 a \`trivial\` change would auto-deploy after a green staging run; a \`sensitive\` one would require a human one-click approve. Nothing is deployed today._"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "risk tier: $tier"

      - name: Validate optional verification inputs
        run: |
          set -euo pipefail
          case "$CONTACTS_PROFILE" in none|ui|security|sales|tax|pos) ;; *) echo "::error::Unknown verification profile"; exit 1;; esac
          if [ -n "$CANDIDATE_SHA" ]; then
            [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Candidate must be an exact commit SHA"; exit 1; }
          elif [ "$CONTACTS_PROFILE" != none ]; then
            echo "::error::A module profile requires an exact candidate SHA"; exit 1
          fi

      - name: Checkout pinned candidate
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Select application source
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE"
          if [ -n "$CANDIDATE_SHA" ]; then
            SOURCE="$GITHUB_WORKSPACE/candidate"
            [ "$(git -C "$SOURCE" rev-parse HEAD)" = "$CANDIDATE_SHA" ] || { echo "::error::Candidate checkout differs from requested SHA"; exit 1; }
          fi
          test -d "$SOURCE/component"
          echo "CONTACTS_QA_SOURCE_DIR=$SOURCE" >> "$GITHUB_ENV"

      - name: Select POS verification for POS changes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          enabled=false
          if [ "$CONTACTS_PROFILE" = pos ]; then
            enabled=true
          elif [ "$CONTACTS_PROFILE" = none ] && [ -f "$CONTACTS_QA_SOURCE_DIR/docs/qa/pos-runtime/verify-runtime.cjs" ]; then
            if [ "$EVENT_NAME" = pull_request ]; then
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' > "$RUNNER_TEMP/pos-changed-files.txt"
              if grep -Eq '^(component/zenith-erp-pos/|docs/qa/pos-runtime/|component/zenith-erp-app/screen/zenithstatic/(js/pos-|css/zenith-theme-v4.css))' "$RUNNER_TEMP/pos-changed-files.txt"; then enabled=true; fi
            elif [ "$EVENT_NAME" = push ]; then
              enabled=true
            fi
          fi
          echo "POS_QA_ENABLED=$enabled" >> "$GITHUB_ENV"
          if [ "$enabled" = true ]; then echo 'CONTACTS_PROFILE=pos' >> "$GITHUB_ENV"; fi

      - name: Download the clean staging image
        run: gh release download "$IMAGE_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$IMAGE_ASSET" --dir "$RUNNER_TEMP"

      - name: Verify the clean image before loading
        run: |
          set -euo pipefail
          [[ "$IMAGE_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Clean image checksum is not pinned"; exit 1; }
          actual=$(sha256sum "$RUNNER_TEMP/$IMAGE_ASSET" | cut -d ' ' -f 1)
          if [ "$actual" = "2da7d916054bf4fccf9c6d32e97b2b2afa0d9ae3531d2a004a4bd87dcf59b18c" ]; then
            echo "::error::Refusing the known unsafe original image archive"; exit 1
          fi
          printf '%s  %s\n' "$IMAGE_SHA256" "$RUNNER_TEMP/$IMAGE_ASSET" | sha256sum --check --strict -

      - name: Load the image
        run: |
          set -euo pipefail
          docker load -i "$RUNNER_TEMP/$IMAGE_ASSET" > "$RUNNER_TEMP/image-load.txt"
          loaded=$(sed -n 's/^Loaded image: //p' "$RUNNER_TEMP/image-load.txt")
          [ "$loaded" = "zetaerp-moqui:clean-staging" ] || { echo "::error::Unexpected clean runtime image tag"; exit 1; }
          echo "loaded: $loaded"
          docker tag "$loaded" zetaerp-moqui:staging

      - name: Enable guarded disposable Tax harness
        if: github.event_name == 'workflow_dispatch' && inputs.contacts_profile == 'tax'
        run: |
          python3 - "$COMPOSE" "$RUNNER_TEMP/tax-compose.yml" <<'PY'
          import sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text()
          lines=text.splitlines()
          matches=[i for i,line in enumerate(lines) if 'JAVA_TOOL_OPTIONS=' in line]
          assert len(matches)==1
          lines[matches[0]] += ' -Dtax.qa.disposable=true'
          Path(sys.argv[2]).write_text('\n'.join(lines)+'\n')
          PY
          echo "COMPOSE=$RUNNER_TEMP/tax-compose.yml" >> "$GITHUB_ENV"

      - name: Boot stack
        # The CI-only compose command keeps HTTP idle until overlays and the loader finish.
        run: docker compose -f "$COMPOSE" up -d

      - name: Overlay the checked-out component tree
        run: |
          set -euo pipefail
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker exec "$CID" sh -c 'rm -rf /opt/moqui/runtime/component/zenith-erp-*'
          tar -C "$CONTACTS_QA_SOURCE_DIR" -czf - component | docker exec -i "$CID" sh -c 'cd /opt/moqui/runtime/component && tar xzf - --strip-components=1'

      - name: Overlay base-component webroot overrides
        # Login.xml / Login.ftl / qapps.xml are ZetaERP's base-component customizations that prod
        # bind-mounts at runtime, so `docker commit` never baked them into the image -> the stock
        # /qapps redirects loop. Copy the committed staging snapshots in so staging == prod.
        run: |
          set -euo pipefail
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          for f in Login.xml Login.ftl qapps.xml; do
            # Base customizations are candidate application configuration, not test-harness code.
            docker cp "$CONTACTS_QA_SOURCE_DIR/docs/infra/ci/base-overrides/$f" "$CID:/opt/moqui/runtime/base-component/webroot/screen/webroot/$f"
          done

      - name: Overlay repository runtime classes and framework patches
        # The clean runtime has no application-specific classes or production-derived patches.
        # Apply this checkout's versions before loading data and restarting for render checks.
        run: |
          set -euo pipefail
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker cp docs/infra/zenith-classes/. "$CID:/opt/moqui/runtime/classes/"
          docker cp docs/infra/framework-patches "$CID:/tmp/ci-framework-patches"
          docker exec "$CID" sh -c '
            set -eu
            P=/tmp/ci-framework-patches
            sh "$P/patch-webroot-nav.sh"
            sh "$P/patch-webroot-breadcrumb.sh"
            sh "$P/patch-webroot-qavatar.sh"
            sh "$P/patch-log4j2-authzfilter.sh"
            for asset in WebrootVue.qvt.js WebrootVue.qvt.min.js; do
              F=/opt/moqui/runtime/base-component/webroot/screen/webroot/js/$asset
              sh "$P/patch-webroot-lazy-rules.sh" "$F"
              sh "$P/patch-webroot-inr-grid.sh" "$F"
            done
            for surface in html vuet qvt; do
              sh "$P/patch-macro-inr.sh" "/opt/moqui/runtime/template/screen-macro/DefaultScreenMacros.$surface.ftl"
            done
          '

      - name: Install the CI-only isolation fixture component
        run: |
          set -euo pipefail
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker exec "$CID" mkdir -p /opt/moqui/runtime/component/ci-staging-fixtures/data
          docker cp docs/infra/ci/seed/component.xml "$CID:/opt/moqui/runtime/component/ci-staging-fixtures/component.xml"
          docker cp docs/infra/ci/seed/isolation.xml "$CID:/opt/moqui/runtime/component/ci-staging-fixtures/data/CiIsolationDemoData.xml"

      - name: Install the CI-only billing fixture component
        run: |
          set -euo pipefail
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker exec "$CID" mkdir -p /opt/moqui/runtime/component/ci-billing-fixtures/data
          docker cp docs/infra/ci/seed/billing-component.xml "$CID:/opt/moqui/runtime/component/ci-billing-fixtures/component.xml"
          docker cp docs/infra/ci/seed/billing.xml "$CID:/opt/moqui/runtime/component/ci-billing-fixtures/data/CiBillingDemoData.xml"

      - name: Install requested Contacts profile fixture
        if: github.event_name == 'workflow_dispatch' && (inputs.contacts_profile == 'ui' || inputs.contacts_profile == 'security')
        run: |
          set -euo pipefail
          case "$CONTACTS_PROFILE" in
            ui) QA_DIR=docs/qa/contacts-ui-runtime ;;
            security) QA_DIR=docs/qa/contacts-security-runtime ;;
            *) exit 1 ;;
          esac
          test -f "$CONTACTS_QA_SOURCE_DIR/$QA_DIR/fixture.xml"
          test -f "$CONTACTS_QA_SOURCE_DIR/$QA_DIR/verify-runtime.cjs"
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker exec "$CID" mkdir -p /opt/moqui/runtime/component/ci-contacts-profile-fixtures/data
          printf '%s\n' '<component name="ci-contacts-profile-fixtures" version="1.0.0"><depends-on name="ci-staging-fixtures"/></component>' |
            docker exec -i "$CID" sh -c 'cat > /opt/moqui/runtime/component/ci-contacts-profile-fixtures/component.xml'
          docker cp "$CONTACTS_QA_SOURCE_DIR/$QA_DIR/fixture.xml" "$CID:/opt/moqui/runtime/component/ci-contacts-profile-fixtures/data/ContactsProfileDemoData.xml"
          if [ "$CONTACTS_PROFILE" = security ]; then
            # Authenticated, synthetic-fixture-restricted QA routes exist only in this disposable stack.
            test -f "$CONTACTS_QA_SOURCE_DIR/$QA_DIR/qa-service-screen.xml"
            docker cp "$CONTACTS_QA_SOURCE_DIR/$QA_DIR/qa-service-screen.xml" "$CID:/opt/moqui/runtime/component/zenith-erp-contacts/screen/zenith/contacts/Contacts/ContactsQaAcceptance.xml"
          fi
          echo "CONTACTS_QA_DIR=$CONTACTS_QA_SOURCE_DIR/$QA_DIR" >> "$GITHUB_ENV"

      - name: Install disposable Sales verification helper
        # Reconciled from PR #23: installs the Sales QA fixture + acceptance screen before the seed load
        # so the 'sales' verification profile can drive Sales flows. Dispatch-only + sales-gated, and it
        # reads from the candidate checkout, so it needs `candidate_sha=<a branch that has
        # docs/qa/sales-runtime/>` (e.g. the Sales PR) — dormant on normal PR/push runs.
        if: github.event_name == 'workflow_dispatch' && inputs.contacts_profile == 'sales'
        run: |
          set -euo pipefail
          QA_DIR="$CONTACTS_QA_SOURCE_DIR/docs/qa/sales-runtime"
          test -f "$QA_DIR/verify-runtime.cjs"
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker cp "$QA_DIR/fixture.xml" "$CID:/opt/moqui/runtime/component/zenith-erp-sales/SalesQaFixture.xml"
          docker cp "$QA_DIR/qa-screen.xml" "$CID:/opt/moqui/runtime/component/zenith-erp-sales/screen/zenith/sales/SalesQaAcceptance.xml"
          docker cp "$CID:/opt/moqui/runtime/component/zenith-erp-sales/screen/zenith/sales.xml" "$RUNNER_TEMP/sales-parent.xml"
          python3 - "$RUNNER_TEMP/sales-parent.xml" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]);s=p.read_text()
          old='<subscreens default-item="SalesDashboard">'
          assert old in s
          s=s.replace(old,old+'<subscreens-item name="SalesQaAcceptance" location="component://zenith-erp-sales/screen/zenith/sales/SalesQaAcceptance.xml" menu-include="false"/>',1)
          p.write_text(s)
          PY
          docker cp "$RUNNER_TEMP/sales-parent.xml" "$CID:/opt/moqui/runtime/component/zenith-erp-sales/screen/zenith/sales.xml"

      - name: Install disposable Tax verification helper
        if: github.event_name == 'workflow_dispatch' && inputs.contacts_profile == 'tax'
        run: |
          set -euo pipefail
          QA_DIR="$CONTACTS_QA_SOURCE_DIR/docs/qa/tax-runtime"
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker cp "$QA_DIR/fixture.xml" "$CID:/opt/moqui/runtime/component/zenith-erp-tax/TaxQaFixture.xml"
          docker cp "$QA_DIR/qa-screen.xml" "$CID:/opt/moqui/runtime/component/zenith-erp-tax/screen/zenith/tax/TaxQaAcceptance.xml"
          docker cp "$CID:/opt/moqui/runtime/component/zenith-erp-tax/screen/zenith/tax.xml" "$RUNNER_TEMP/tax-parent.xml"
          python3 - "$RUNNER_TEMP/tax-parent.xml" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]);s=p.read_text();old='<subscreens default-item="TaxDashboard">'
          assert old in s
          p.write_text(s.replace(old,old+'<subscreens-item name="TaxQaAcceptance" location="component://zenith-erp-tax/screen/zenith/tax/TaxQaAcceptance.xml" menu-include="false"/>',1))
          PY
          docker cp "$RUNNER_TEMP/tax-parent.xml" "$CID:/opt/moqui/runtime/component/zenith-erp-tax/screen/zenith/tax.xml"

      - name: Install disposable POS verification helper
        if: env.POS_QA_ENABLED == 'true'
        run: |
          set -euo pipefail
          QA_DIR="$CONTACTS_QA_SOURCE_DIR/docs/qa/pos-runtime"
          test -f "$QA_DIR/verify-runtime.cjs"
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker cp "$QA_DIR/fixture.xml" "$CID:/opt/moqui/runtime/component/zenith-erp-pos/PosQaFixture.xml"
          docker cp "$QA_DIR/fixture-types.xml" "$CID:/opt/moqui/runtime/component/zenith-erp-pos/PosQaTypes.xml"
          docker cp "$QA_DIR/qa-screen.xml" "$CID:/opt/moqui/runtime/component/zenith-erp-pos/screen/zenith/pos/Pos/PosQaAcceptance.xml"

      - name: Load discovered seed, demo and isolation fixtures in one invocation
        # Exploded Moqui runtime: java -cp . MoquiStart from /opt/moqui; java at /opt/java/openjdk/bin/java.
        # An explicit location bypasses normal component/framework data discovery, even with types.
        # The temporary component depends on contacts, so its demo fixture loads after prerequisites.
        # The loader can skip individual unrelated files; required records are asserted below.
        run: |
          set -euo pipefail
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker exec "$CID" sh -lc 'cd /opt/moqui && /opt/java/openjdk/bin/java -cp . MoquiStart load types=seed,seed-initial,demo no-run-es' \
            2>&1 | tee "$RUNNER_TEMP/seed.txt"

      - name: Assert required seed and tenant records in the fresh database
        run: |
          set -euo pipefail
          DBID=$(docker compose -f "$COMPOSE" ps -q db)
          docker exec -i "$DBID" psql -U moqui -d moqui -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM user_account WHERE user_id='EX_JOHN_DOE' AND username='john.doe' AND disabled='N' AND party_id='EX_JOHN_DOE') THEN
              RAISE EXCEPTION 'Required active demo login or synthetic party association is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM user_group_member WHERE user_id='EX_JOHN_DOE' AND user_group_id IN ('ADMIN','ZENITH_ADMIN') AND (thru_date IS NULL OR thru_date>CURRENT_TIMESTAMP)) THEN
              RAISE EXCEPTION 'Required demo admin module access is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM user_preference WHERE user_id='EX_JOHN_DOE' AND preference_key='ACTIVE_ORGANIZATION' AND preference_value='CITEST_ORG_A') THEN
              RAISE EXCEPTION 'Required active synthetic organization preference is missing';
            END IF;
            IF (SELECT COUNT(*) FROM party_role WHERE party_id IN ('CITEST_ORG_A','CITEST_ORG_B') AND role_type_id='OrgInternal')<>2 THEN
              RAISE EXCEPTION 'Synthetic internal organization roles are missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM party_relationship WHERE party_relationship_id='CITEST_REL_JD_A' AND from_party_id='EX_JOHN_DOE' AND to_party_id='CITEST_ORG_A' AND relationship_type_enum_id='PrtAgent' AND to_role_type_id='OrgInternal') THEN
              RAISE EXCEPTION 'Synthetic organization agent relationship is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM party p JOIN person n ON n.party_id=p.party_id WHERE p.party_id='CITEST_A_CUST' AND p.owner_party_id='CITEST_ORG_A' AND n.last_name='CITestOnlyInTenantA')
              OR NOT EXISTS (SELECT 1 FROM party p JOIN person n ON n.party_id=p.party_id WHERE p.party_id='CITEST_B_CUST' AND p.owner_party_id='CITEST_ORG_B' AND n.last_name='CITestOnlyInTenantB') THEN
              RAISE EXCEPTION 'Required tenant-owned synthetic contacts are missing';
            END IF;
          END $$;
          SQL
          echo "Required login, organization and contact fixture records are present"

      - name: Start Moqui after overlays and verified seed data
        # One JVM owns the Bitronix journal/schema at a time; the loader has exited now.
        run: docker compose -f "$COMPOSE" exec -T moqui touch /tmp/ci-start-moqui

      - name: Wait for Moqui to respond
        run: |
          for i in $(seq 1 48); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/Login/login || true)
            [ -n "$code" ] && [ "$code" != "000" ] && { echo "responding ($code) after $i"; exit 0; }
            sleep 5
          done
          echo "::error::Moqui never responded"; exit 1

      - name: Diagnose login + data state
        # Non-fatal, always runs: prints exactly what's in the DB and what the login returns, so the
        # seed fixtures can be built precisely instead of guessing across runs.
        if: always()
        run: |
          DBID=$(docker compose -f "$COMPOSE" ps -q db)
          q(){ docker exec "$DBID" psql -U moqui -d moqui -P pager=off -c "$1" 2>&1 || true; }
          echo "=== john.doe UserAccount ==="; q "SELECT user_id,username,disabled,require_password_change,password_hash_type FROM user_account WHERE username='john.doe';"
          echo "=== john.doe groups ==="; q "SELECT user_group_id FROM user_group_member WHERE user_id='EX_JOHN_DOE';"
          echo "=== some organizations ==="; q "SELECT party_id FROM party WHERE party_type_enum_id='PtyOrganization' LIMIT 8;"
          echo "=== parties owned (owner -> count) ==="; q "SELECT owner_party_id, count(*) FROM party WHERE owner_party_id IS NOT NULL GROUP BY owner_party_id ORDER BY 2 DESC LIMIT 8;"
          echo "=== john.doe active-org pref ==="; q "SELECT preference_value FROM user_preference WHERE user_id='EX_JOHN_DOE' AND preference_key='ACTIVE_ORGANIZATION';"
          echo "=== GET /apps/zenith (authed) ==="; curl -s -o /dev/null -w 'code=%{http_code} redirect=%{redirect_url}\n' -u john.doe:moqui http://localhost:8080/apps/zenith || true
          echo "=== body snippet ==="; curl -s -u john.doe:moqui http://localhost:8080/apps/zenith | tr '\n' ' ' | head -c 700; echo

      - name: Assert login works (gate)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -u john.doe:moqui http://localhost:8080/apps/zenith || true)
          [ "$code" = "200" ] || { echo "::error::login/module access not 200 (got $code) — see diagnostics"; exit 1; }

      - name: Assert SaaS pages and tenant-access service resolve
        run: |
          CID=$(docker compose -f "$COMPOSE" ps -q moqui)
          docker exec "$CID" test -s /opt/moqui/runtime/component/zenith-erp-saas/service/zenith/saas/SaasAccessServices.xml || {
            echo "::error::SaaS tenant-access service definition is missing from the deployed component tree"; exit 1;
          }
          for route in /apps/zenith/my-subscription /qapps/zenith/my-subscription.qvt \
                       /apps/zenith/saas-admin/PlanAssignments /qapps/zenith/saas-admin/PlanAssignments.qvt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u john.doe:moqui "http://localhost:8080$route" || true)
            [ "$code" = "200" ] || { echo "::error::SaaS route $route returned $code (check SaasAccessServices registration and server logs)"; exit 1; }
          done

      - name: Assert fixtures loaded (DB ground truth)
        # Prove the demo load AND the isolation fixture actually landed, and the active-org pref stuck,
        # BEFORE the render assert — so a silent load failure or a stripped pref fails HERE with a
        # precise message instead of looking like an isolation leak in the next step.
        run: |
          DBID=$(docker compose -f "$COMPOSE" ps -q db)
          g(){ docker exec "$DBID" psql -U moqui -d moqui -tAc "$1" 2>/dev/null | tr -d '[:space:]'; }
          echo "--- CITEST ground truth ---"
          docker exec "$DBID" psql -U moqui -d moqui -P pager=off -c \
            "SELECT party_id, party_type_enum_id, owner_party_id, disabled FROM party WHERE party_id LIKE 'CITEST%' ORDER BY party_id;" 2>&1 || true
          docker exec "$DBID" psql -U moqui -d moqui -P pager=off -c \
            "SELECT party_relationship_id, from_party_id, to_party_id, to_role_type_id, from_date, thru_date FROM party_relationship WHERE party_relationship_id='CITEST_REL_JD_A';" 2>&1 || true
          ACT=$(g "SELECT preference_value FROM user_preference WHERE user_id='EX_JOHN_DOE' AND preference_key='ACTIVE_ORGANIZATION';")
          echo "active-org pref = '${ACT}'"
          [ "$(g "SELECT count(*) FROM user_account WHERE username='john.doe';")" = "1" ] || { echo "::error::demo load failed — john.doe missing"; exit 1; }
          [ "$(g "SELECT count(*) FROM person WHERE party_id='CITEST_A_CUST';")" = "1" ] || { echo "::error::fixture load failed — CITEST_A_CUST missing"; exit 1; }
          [ "$(g "SELECT count(*) FROM person WHERE party_id='CITEST_B_CUST';")" = "1" ] || { echo "::error::fixture load failed — CITEST_B_CUST missing"; exit 1; }
          [ "$(g "SELECT count(*) FROM party_relationship WHERE party_relationship_id='CITEST_REL_JD_A';")" = "1" ] || { echo "::error::fixture load failed — membership relationship missing"; exit 1; }
          [ "$ACT" = "CITEST_ORG_A" ] || { echo "::error::active-org pref is '${ACT}', expected CITEST_ORG_A (stripped? membership not recognized?) — the render isolation assert would false-positive, so failing here"; exit 1; }
          echo "OK — demo + fixtures loaded, john.doe active org = CITEST_ORG_A"

      - name: Org-isolation assert
        # As john.doe (active org = CI Tenant A), the contacts list must show Tenant A's contact and
        # NOT Tenant B's — validates live active-org scoping (catches a gross isolation regression).
        # TODO once #14 is merged: add the stronger no-org-empty + forged-?ownerPartyId asserts that
        # #14 fixes (they'd red the current pre-#14 master, so they wait).
        run: |
          html=$(curl -s -u john.doe:moqui 'http://localhost:8080/apps/zenith/Contacts/FindContact')
          echo "$html" | grep -q 'CITestOnlyInTenantA' || { echo "::error::isolation: Tenant A's own contact is missing (active-org scoping broken, or the pref was stripped)"; exit 1; }
          if echo "$html" | grep -q 'CITestOnlyInTenantB'; then echo "::error::ISOLATION LEAK — Tenant B's contact is visible to Tenant A"; exit 1; fi
          echo "OK — org-isolation holds: Tenant A sees its own contact, not Tenant B's"

      - name: Org-isolation assert (non-admin tenant member — #22 lockout guard)
        # john.doe is ADMIN, so the assert above only exercises the active-org PREFERENCE path. This one
        # logs in as citest.a — a NON-ADMIN who IS a member of Tenant A — so the contacts flows must
        # resolve its org from authoritative membership. It must still see Tenant A's contact (NO
        # lockout) and not Tenant B's. On pre-#22 master this uses the preference; under #22 (run via
        # `workflow_dispatch` with candidate_sha=<#22 head>) it exercises get#AuthorizedActiveOrganization
        # -> get#PartyOrganizationInfo, proving a legit MARUTHI-shaped member is not fail-closed out.
        # This is the MARUTHI-safety gate for #22 and guards every future tenant-auth change.
        run: |
          DBID=$(docker compose -f "$COMPOSE" ps -q db)
          # The fixture creates citest.a without a password; give it the demo 'moqui' password by
          # copying john.doe's hash columns (ephemeral CI user, synthetic — 'moqui' is the demo password).
          echo "password copy: $(docker exec "$DBID" psql -U moqui -d moqui -tAc "UPDATE user_account ua SET current_password=jd.current_password, password_hash_type=jd.password_hash_type, password_salt=jd.password_salt, password_base64=jd.password_base64, require_password_change='N', disabled='N' FROM user_account jd WHERE jd.username='john.doe' AND ua.user_id='CITEST_U_A';" 2>&1)"
          g(){ docker exec "$DBID" psql -U moqui -d moqui -tAc "$1" 2>/dev/null | tr -d '[:space:]'; }
          [ "$(g "SELECT count(*) FROM user_account WHERE user_id='CITEST_U_A';")" = "1" ] || { echo "::error::fixture: citest.a user missing"; exit 1; }
          echo "citest.a username in DB: '$(g "SELECT username FROM user_account WHERE user_id='CITEST_U_A';")'  pw-matches-john: $(g "SELECT (ua.current_password=jd.current_password AND ua.password_salt IS NOT DISTINCT FROM jd.password_salt) FROM user_account ua, user_account jd WHERE ua.user_id='CITEST_U_A' AND jd.username='john.doe';")"
          [ "$(g "SELECT count(*) FROM user_group_member WHERE user_id='CITEST_U_A' AND user_group_id='ADMIN';")" = "0" ] || { echo "::error::test setup: citest.a must NOT be ADMIN (else it skips the non-admin path)"; exit 1; }
          echo "--- diagnostic: citest.a auth + redirect target ---"
          curl -s -o /dev/null -w 'root: code=%{http_code} redirect=%{redirect_url}\n' -u citest.a:moqui 'http://localhost:8080/apps/zenith' || true
          curl -s -D - -o /dev/null -u citest.a:moqui 'http://localhost:8080/apps/zenith/Contacts/FindContact' | grep -iE '^(HTTP/|location:)' || true
          code=$(curl -s -o /dev/null -w '%{http_code}' -u citest.a:moqui 'http://localhost:8080/apps/zenith/Contacts/FindContact')
          [ "$code" = "200" ] || { echo "::error::non-admin member citest.a got HTTP $code on FindContact (login failed, or a gate blocked a legit member) — see diagnostic above"; exit 1; }
          html=$(curl -s -u citest.a:moqui 'http://localhost:8080/apps/zenith/Contacts/FindContact')
          echo "$html" | grep -q 'CITestOnlyInTenantA' || { echo "::error::LOCKOUT: a non-admin MEMBER of Tenant A cannot see Tenant A's own contact — the active-org resolver did not recognize its membership (MARUTHI tenant-user lockout risk)"; exit 1; }
          if echo "$html" | grep -q 'CITestOnlyInTenantB'; then echo "::error::ISOLATION LEAK — non-admin member of A sees Tenant B's contact"; exit 1; fi
          echo "OK — non-admin member of Tenant A sees A's contact, not B's (no lockout; isolation holds)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          if [ "$CONTACTS_PROFILE" = none ]; then npm i puppeteer@23 --no-save
          else npm i puppeteer@23 playwright@1.62.1 --no-save; fi

      - name: Render smoke (both surfaces)
        run: |
          set -o pipefail
          node docs/infra/ci/smoke.mjs http://localhost:8080 | tee "$RUNNER_TEMP/smoke.txt"

      - name: POS dashboard, account toolbar and Remember Me regression
        run: node docs/infra/ci/dashboard-account-regression.mjs http://localhost:8080

      - name: Upload POS dashboard and account toolbar evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-dashboard-customize-disposable
          path: |
            ${{ runner.temp }}/pos-dashboard-customize-ci.png
            ${{ runner.temp }}/account-toolbar-ci.png
          if-no-files-found: ignore

      - name: Run requested Contacts verification
        if: github.event_name == 'workflow_dispatch' && (inputs.contacts_profile == 'ui' || inputs.contacts_profile == 'security')
        env:
          CONTACTS_QA_BASE_URL: http://127.0.0.1:8080
          CONTACTS_QA_DB_MODE: postgres
          # Public demo login, only for this new disposable database.
          CONTACTS_QA_USERNAME: john.doe
          CONTACTS_QA_PASSWORD: moqui
        run: |
          set -euo pipefail
          export CONTACTS_QA_DB_CONTAINER=$(docker compose -f "$COMPOSE" ps -q db)
          export CONTACTS_QA_APP_CONTAINER=$(docker compose -f "$COMPOSE" ps -q moqui)
          export CONTACTS_QA_CHROME=$(node -e 'process.stdout.write(require("puppeteer").executablePath())')
          if [ "$CONTACTS_PROFILE" = ui ]; then export CONTACTS_QA_REQUIRE_MOBILE_HEADER=1; fi
          export CONTACTS_QA_OUTPUT_DIR="$RUNNER_TEMP/contacts-profile"
          mkdir -p "$CONTACTS_QA_OUTPUT_DIR"
          node "$CONTACTS_QA_DIR/verify-runtime.cjs"

      - name: Save Contacts verification evidence
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.contacts_profile == 'ui' || inputs.contacts_profile == 'security')
        uses: actions/upload-artifact@v4
        with:
          name: contacts-${{ inputs.contacts_profile }}-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/contacts-profile
          if-no-files-found: warn
          retention-days: 14

      - name: Assert billing fixtures loaded (DB ground truth)
        # Prove the MARUTHI-shaped billing seed (docs/infra/ci/seed/billing.xml) landed before minting,
        # so a load failure fails HERE precisely instead of as a confusing mint error.
        run: |
          DBID=$(docker compose -f "$COMPOSE" ps -q db)
          g(){ docker exec "$DBID" psql -U moqui -d moqui -tAc "$1" 2>/dev/null | tr -d '[:space:]'; }
          docker exec "$DBID" psql -U moqui -d moqui -P pager=off -c \
            "SELECT product_id, mrp_amount, gst_slab_id FROM product WHERE product_id LIKE 'CITEST_BW%' ORDER BY product_id;" 2>&1 || true
          [ "$(g "SELECT count(*) FROM pos_terminal WHERE terminal_id='CITEST_A_TERM' AND organization_party_id='CITEST_ORG_A';")" = "1" ] || { echo "::error::billing seed: PosTerminal CITEST_A_TERM missing"; exit 1; }
          [ "$(g "SELECT count(*) FROM pos_session WHERE session_id='CITEST_A_SESS' AND status_id='PsOpen';")" = "1" ] || { echo "::error::billing seed: open PosSession CITEST_A_SESS missing"; exit 1; }
          [ "$(g "SELECT count(*) FROM product WHERE product_id LIKE 'CITEST_BW%' AND gst_slab_id IS NOT NULL;")" = "3" ] || { echo "::error::billing seed: expected 3 CITEST_BW products with a gst_slab_id"; exit 1; }
          [ "$(g "SELECT count(*) FROM pos_product_mode_price WHERE product_id LIKE 'CITEST_BW%';")" = "6" ] || { echo "::error::billing seed: expected 6 PosProductModePrice rows"; exit 1; }
          [ "$(g "SELECT count(*) FROM company_settings WHERE organization_party_id='CITEST_ORG_A' AND setting_key='TAX_CALCULATION_SERVICE';")" = "1" ] || { echo "::error::billing seed: TAX_CALCULATION_SERVICE missing -> tax would compute to ZERO"; exit 1; }
          echo "OK — billing fixtures present (terminal, open session, 3 slab products, 6 mode prices, tax service)"

      - name: Mint POS bills (headless driver)
        # Replays the /apps terminal's mint transitions (no REST) as john.doe on CITEST_ORG_A:
        # RETAIL/WHOLESALE/EMPLOYEE cash sales + a split tender. Writes <scenario>=<txnId> for the assert.
        env:
          BILLING_OUT: ${{ runner.temp }}/billing_txns.env
        run: node docs/infra/ci/billing.mjs http://localhost:8080

      - name: Assert billing math (DB ground truth vs golden baseline)
        # Tax-exclusive, intra-state CGST+SGST, each component 2dp HALF_UP, payable = round(grand,0).
        run: |
          set -a; . "$RUNNER_TEMP/billing_txns.env"; set +a      # sets A B C D = transaction ids
          DBID=$(docker compose -f "$COMPOSE" ps -q db)
          docker exec "$DBID" psql -U moqui -d moqui -P pager=off -c \
            "SELECT transaction_id, sales_mode_id, subtotal, total_tax_amount, grand_total, payable_amount, round_off, status_id, transaction_number FROM pos_transaction WHERE transaction_id IN ('$A','$B','$C','$D') ORDER BY entry_date;" 2>&1 || true
          # These captured ids belong only to the disposable billing fixtures. POS and
          # Invoice ids have independent sequences and may coincide after async sync.
          docker exec "$DBID" psql -U moqui -d moqui -P pager=off -c \
            "SELECT reference_type, reference_id, tax_name, sum(tax_amount) AS tax_amount FROM tax_line_detail WHERE reference_id IN ('$A','$B','$C','$D') GROUP BY reference_type, reference_id, tax_name ORDER BY reference_id, reference_type, tax_name;" 2>&1 || true
          FAILED=0
          chk(){ r=$(docker exec "$DBID" psql -U moqui -d moqui -tAc "$2" 2>/dev/null | tr -d '[:space:]'); [ "$r" = "t" ] || { echo "::error::billing assert FAILED: $1 (got '$r')"; FAILED=1; }; }
          # A — RETAIL cash, CITEST_BW18 (mrp 100, GST18): grand 118, CGST 9 + SGST 9
          chk "A header (grand 118 / tax 18 / sub 100 / payable 118 / completed / bill#)" "SELECT (grand_total=118.00 AND total_tax_amount=18.00 AND subtotal=100.00 AND payable_amount=118 AND status_id='PtCompleted' AND transaction_number IS NOT NULL) FROM pos_transaction WHERE transaction_id='$A';"
          chk "A line (retail unit_price=100, qty 1)" "SELECT (unit_price=100.00 AND quantity=1) FROM pos_transaction_item WHERE transaction_id='$A';"
          chk "A CGST=9 + SGST=9 (intra-state)" "SELECT ((SELECT coalesce(sum(tax_amount),0) FROM tax_line_detail WHERE reference_type='PosTransactionItem' AND reference_id='$A' AND tax_name='CGST')=9.00 AND (SELECT coalesce(sum(tax_amount),0) FROM tax_line_detail WHERE reference_type='PosTransactionItem' AND reference_id='$A' AND tax_name='SGST')=9.00);"
          # B — WHOLESALE cash, CITEST_BW12 x3 (mode 180, GST12): grand 604.80, payable 605, roundOff 0.20
          chk "B header (grand 604.80 / tax 64.80 / sub 540 / payable 605 / roundoff 0.20)" "SELECT (grand_total=604.80 AND total_tax_amount=64.80 AND subtotal=540.00 AND payable_amount=605 AND round_off=0.20 AND status_id='PtCompleted') FROM pos_transaction WHERE transaction_id='$B';"
          chk "B line (wholesale unit_price=180, qty 3)" "SELECT (unit_price=180.00 AND quantity=3) FROM pos_transaction_item WHERE transaction_id='$B';"
          # C — EMPLOYEE cash, CITEST_BW5 (mode 80, GST5): grand 84
          chk "C header (grand 84 / tax 4 / sub 80 / payable 84)" "SELECT (grand_total=84.00 AND total_tax_amount=4.00 AND subtotal=80.00 AND payable_amount=84 AND status_id='PtCompleted') FROM pos_transaction WHERE transaction_id='$C';"
          chk "C line (employee unit_price=80)" "SELECT (unit_price=80.00 AND quantity=1) FROM pos_transaction_item WHERE transaction_id='$C';"
          # D — RETAIL split, CITEST_BW18: grand 118, two tenders (cash 60 + card 58) reconcile
          chk "D header (grand 118 / payable 118 / completed)" "SELECT (grand_total=118.00 AND payable_amount=118 AND status_id='PtCompleted') FROM pos_transaction WHERE transaction_id='$D';"
          chk "D split tenders (2 rows summing 118.00)" "SELECT ((SELECT count(*) FROM pos_payment WHERE transaction_id='$D')=2 AND (SELECT sum(amount) FROM pos_payment WHERE transaction_id='$D')=118.00);"
          [ "$FAILED" = "0" ] && echo "OK — billing math matches golden baseline (modes RETAIL/WHOLESALE/EMPLOYEE, slabs 5/12/18%, whole-rupee rounding, split reconcile)" || { echo "::error::one or more billing math asserts failed"; exit 1; }

      - name: Verify POS functions, isolation and responsive UI
        if: env.POS_QA_ENABLED == 'true'
        env:
          POS_QA_BASE: http://localhost:8080
          POS_QA_OUT: ${{ runner.temp }}/pos-profile
        run: |
          set -euo pipefail
          export NODE_PATH="$GITHUB_WORKSPACE/node_modules"
          export POS_QA_CHROME=$(node -e 'process.stdout.write(require("puppeteer").executablePath())')
          node "$CONTACTS_QA_SOURCE_DIR/docs/qa/pos-runtime/verify-runtime.cjs"
          node "$CONTACTS_QA_SOURCE_DIR/docs/qa/pos-runtime/verify-offline-cart.cjs"
          if [ -f "$CONTACTS_QA_SOURCE_DIR/docs/qa/pos-runtime/verify-catalog-navigation.cjs" ]; then
            node "$CONTACTS_QA_SOURCE_DIR/docs/qa/pos-runtime/verify-catalog-navigation.cjs"
          fi

      - name: Save POS verification evidence
        if: always() && env.POS_QA_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pos-${{ inputs.candidate_sha || github.sha }}
          path: ${{ runner.temp }}/pos-profile
          if-no-files-found: error
          retention-days: 14

      - name: Verify Sales functions, isolation and responsive UI
        # Reconciled from PR #23: runs the Sales QA suite against the running app. Dispatch-only +
        # sales-gated; drive it with `candidate_sha=<Sales PR head>`.
        if: github.event_name == 'workflow_dispatch' && inputs.contacts_profile == 'sales'
        env:
