          export SALES_QA_CHROME=$(node -e 'process.stdout.write(require("puppeteer").executablePath())')
          # inspect-pdf.py (PDF-text assertions) needs pypdf, not on the runner by default.
          python3 -m pip install --quiet --disable-pip-version-check 'pypdf==6.10.0'
          node "$CONTACTS_QA_SOURCE_DIR/docs/qa/sales-runtime/verify-runtime.cjs"

      - name: Save Sales verification evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.contacts_profile == 'sales'
        uses: actions/upload-artifact@v4
        with:
          name: sales-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/sales-profile
          if-no-files-found: error
